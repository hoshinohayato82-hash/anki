<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="暗記カード">
<title>暗記カード</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d1f23;--sub:#6b7280;--line:#e5e7eb;--accent:#2563eb;--again:#dc2626;--hard:#d97706;--good:#16a34a;--easy:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1c1f24;--text:#e8eaed;--sub:#9aa0a6;--line:#2d3139;--accent:#60a5fa;--easy:#3b82f6}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header #back,header #actions{min-width:80px}
header #actions{display:flex;justify-content:flex-end}
main{padding:16px;max-width:640px;margin:0 auto}
button{font:inherit;font-size:15px;border:none;border-radius:10px;padding:10px 14px;background:var(--line);color:var(--text);cursor:pointer}
button:disabled{opacity:.45}
button.primary{background:var(--accent);color:#fff}
button.danger{background:transparent;color:var(--again)}
button.link{background:transparent;color:var(--accent);padding:6px 4px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.deck-name{font-weight:600;font-size:17px}
.count,.meta{color:var(--sub);font-size:13px;margin-top:4px}
.count b{color:var(--accent);font-size:15px}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea,input[type=search]{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
textarea{min-height:90px;resize:vertical}
.field>label{font-weight:600;display:block;margin:18px 0 6px}
.imgbox img{max-width:100%;max-height:240px;border-radius:8px;display:block;margin-top:8px}
.study-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;min-height:40vh}
.side-text{white-space:pre-wrap;font-size:20px;line-height:1.6;word-break:break-word}
.side-img{max-width:100%;max-height:50vh;display:block;margin:12px auto 0;border-radius:8px}
hr.divider{border:none;border-top:1px dashed var(--line);margin:20px 0}
.bottombar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.bottombar>*{max-width:608px;margin:0 auto}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{display:flex;flex-direction:column;align-items:center;padding:8px 4px;color:#fff}
.grade small{font-size:12px;opacity:.9}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50}
.overlay img{max-width:100%;max-height:100%}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <button id="back" class="link">‹ 戻る</button>
  <h1 id="title">暗記カード</h1>
  <div id="actions"></div>
</header>
<main id="main"></main>
<div id="toast" class="toast"></div>

<script>
// ===== DB（IndexedDB） =====
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('anki-cards',1);
    r.onupgradeneeded=()=>{
      const d=r.result;
      d.createObjectStore('decks',{keyPath:'id'});
      d.createObjectStore('cards',{keyPath:'id'}).createIndex('deckId','deckId');
      d.createObjectStore('images',{keyPath:'id'}); // 画像は別ストア（カード一覧を軽くするため）
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
function tx(store,mode,fn){
  return new Promise((res,rej)=>{
    const t=db.transaction(store,mode);
    let out;
    const req=fn(t.objectStore(store));
    if(req)req.onsuccess=()=>{out=req.result};
    t.oncomplete=()=>res(out);
    t.onerror=()=>rej(t.error);
  });
}
function txMulti(stores,fn){
  return new Promise((res,rej)=>{
    const t=db.transaction(stores,'readwrite');
    fn(Object.fromEntries(stores.map(s=>[s,t.objectStore(s)])));
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error);
    t.onabort=()=>rej(t.error);
  });
}
const getAll=s=>tx(s,'readonly',o=>o.getAll());
const get=(s,id)=>tx(s,'readonly',o=>o.get(id));
const put=(s,v)=>tx(s,'readwrite',o=>o.put(v));
const cardsOf=deckId=>tx('cards','readonly',o=>o.index('deckId').getAll(deckId));
const getImg=async id=>id?((await get('images',id))?.data??null):null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

// ===== 出題スケジュール（SM-2ベース） =====
const DAY=86400000;
const GRADES=[{key:'again',label:'もう一度'},{key:'hard',label:'難しい'},{key:'good',label:'正解'},{key:'easy',label:'簡単'}];
// 1日の区切りは朝4時（夜中に勉強しても「今日」扱い）
function dayStart(t=Date.now()){
  const d=new Date(t);
  if(d.getHours()<4)d.setDate(d.getDate()-1);
  d.setHours(4,0,0,0);
  return d.getTime();
}
// g: 0=もう一度 1=難しい 2=正解 3=簡単
function schedule(c,g,now=Date.now()){
  let {interval=0,ease=2.5,reps=0,lapses=0}=c;
  if(g===0){
    return {interval:0,ease:Math.max(1.3,ease-0.2),reps:0,lapses:reps>0?lapses+1:lapses,due:now+60000};
  }
  let iv;
  if(reps===0) iv=[0,1,1,4][g];
  else if(reps===1) iv=[0,2,6,10][g];
  else if(g===1) iv=Math.max(interval+1,interval*1.2);
  else if(g===2) iv=Math.max(interval+1,interval*ease);
  else iv=Math.max(interval+2,interval*ease*1.3);
  iv=Math.round(iv);
  if(g===1)ease=Math.max(1.3,ease-0.15);
  if(g===3)ease+=0.15;
  return {interval:iv,ease,reps:reps+1,lapses,due:dayStart(now)+iv*DAY};
}
function fmtIv(iv){
  if(iv===0)return '1分';
  if(iv<30)return iv+'日';
  if(iv<365)return (iv/30).toFixed(1)+'ヶ月';
  return (iv/365).toFixed(1)+'年';
}
function fmtDate(t){
  if(t<=Date.now())return '今日';
  const d=new Date(t);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// ===== UIヘルパー =====
function h(tag,attrs={},...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(k==='class')el.className=v;
    else if(v!==false&&v!=null)el.setAttribute(k,v===true?'':v);
  }
  for(const k of kids.flat()){
    if(k==null||k===false)continue;
    el.append(k.nodeType?k:document.createTextNode(String(k)));
  }
  return el;
}
const $main=document.getElementById('main');
let keyHandler=null;
document.addEventListener('keydown',e=>{
  if(!keyHandler||['TEXTAREA','INPUT'].includes(e.target.tagName))return;
  keyHandler(e);
});
function setHeader(title,back,actions=[]){
  keyHandler=null;
  document.getElementById('title').textContent=title;
  const b=document.getElementById('back');
  b.style.visibility=back?'visible':'hidden';
  b.onclick=back?()=>back():null;
  document.getElementById('actions').replaceChildren(...actions);
}
function show(...nodes){$main.replaceChildren(...nodes.filter(Boolean));window.scrollTo(0,0);}
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}
function zoom(src){
  const o=h('div',{class:'overlay',onclick:()=>o.remove()},h('img',{src}));
  document.body.append(o);
}
const firstLine=s=>(s||'').trim().split('\n')[0].slice(0,80);

// 画像を縮小してJPEGに（容量節約）
function loadImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);res(img)};
    img.onerror=e=>{URL.revokeObjectURL(url);rej(e)};
    img.src=url;
  });
}
async function resizeImage(file,max=1400){
  const img=await loadImage(file);
  const s=Math.min(1,max/Math.max(img.width,img.height));
  const w=Math.round(img.width*s),hh=Math.round(img.height*s);
  const c=document.createElement('canvas');c.width=w;c.height=hh;
  const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,w,hh);
  x.drawImage(img,0,0,w,hh);
  return c.toDataURL('image/jpeg',0.85);
}

// ===== ホーム（デッキ一覧） =====
async function renderHome(){
  setHeader('暗記カード',null,[h('button',{class:'link',onclick:renderSettings},'設定')]);
  const [decks,cards]=await Promise.all([getAll('decks'),getAll('cards')]);
  decks.sort((a,b)=>a.created-b.created);
  const now=Date.now();
  const list=h('div',{class:'list'},decks.map(d=>{
    const cs=cards.filter(c=>c.deckId===d.id);
    const due=cs.filter(c=>c.due<=now).length;
    return h('div',{class:'item'},
      h('div',{class:'deck-name',onclick:()=>renderDeck(d.id)},d.name),
      h('div',{class:'count'},'今日 ',h('b',{},due),` 枚 / 全 ${cs.length} 枚`),
      h('div',{class:'row',style:'margin-top:10px'},
        h('button',{class:'primary',disabled:due===0,onclick:()=>renderStudy(d.id)},'学習する'),
        h('button',{onclick:()=>renderEditor(d.id)},'＋ 追加'),
        h('button',{onclick:()=>renderDeck(d.id)},'一覧')));
  }));
  show(decks.length?list:h('div',{class:'empty'},'まだデッキがありません'),
    h('div',{style:'margin-top:16px'},
      h('button',{class:'primary',style:'width:100%',onclick:newDeck},'＋ 新しいデッキ')));
}
async function newDeck(){
  const name=prompt('デッキ名');
  if(!name||!name.trim())return;
  await put('decks',{id:uid(),name:name.trim(),created:Date.now()});
  renderHome();
}

// ===== デッキ詳細（カード一覧） =====
async function renderDeck(deckId){
  const deck=await get('decks',deckId);
  if(!deck)return renderHome();
  setHeader(deck.name,renderHome);
  const cards=(await cardsOf(deckId)).sort((a,b)=>b.created-a.created);
  const due=cards.filter(c=>c.due<=Date.now()).length;
  const search=h('input',{type:'search',placeholder:'カードを検索'});
  const listEl=h('div',{class:'list'});
  const draw=()=>{
    const q=search.value.trim().toLowerCase();
    const f=cards.filter(c=>!q||(c.front+'\n'+c.back).toLowerCase().includes(q));
    listEl.replaceChildren(...(f.length?f.map(c=>h('div',{class:'item',onclick:()=>renderEditor(deckId,c.id)},
      h('div',{class:'clip'},firstLine(c.front)||'（画像のみ）',(c.frontImg||c.backImg)?' 🖼':''),
      h('div',{class:'meta clip'},firstLine(c.back)),
      h('div',{class:'meta'},c.lastReview==null?'新規':`次回 ${fmtDate(c.due)}（間隔 ${fmtIv(c.interval)}）`)))
      :[h('div',{class:'empty'},cards.length?'該当なし':'カードがありません')]));
  };
  search.addEventListener('input',draw);
  show(
    h('div',{class:'row'},
      h('button',{class:'primary',disabled:due===0,onclick:()=>renderStudy(deckId)},`学習する（${due}）`),
      h('button',{onclick:()=>renderEditor(deckId)},'＋ カード追加')),
    h('div',{style:'margin:14px 0'},search),
    listEl,
    h('div',{class:'row',style:'margin-top:28px'},
      h('button',{onclick:()=>renameDeck(deck)},'名前を変更'),
      h('button',{class:'danger',onclick:()=>deleteDeck(deck,cards)},'デッキを削除')));
  draw();
}
async function renameDeck(deck){
  const name=prompt('新しい名前',deck.name);
  if(!name||!name.trim())return;
  await put('decks',{...deck,name:name.trim()});
  renderDeck(deck.id);
}
async function deleteDeck(deck,cards){
  if(!confirm(`「${deck.name}」とカード${cards.length}枚を削除します。元に戻せません。`))return;
  await txMulti(['decks','cards','images'],s=>{
    for(const c of cards){
      if(c.frontImg)s.images.delete(c.frontImg);
      if(c.backImg)s.images.delete(c.backImg);
      s.cards.delete(c.id);
    }
    s.decks.delete(deck.id);
  });
  toast('削除しました');
  renderHome();
}

// ===== カード作成・編集 =====
function makeSide(label,text,img){
  let cur=img,changed=false;
  const ta=h('textarea',{placeholder:'テキスト（画像だけなら空でOK）'},text);
  const file=h('input',{type:'file',accept:'image/*',style:'display:none'});
  const preview=h('div',{class:'imgbox'});
  const draw=()=>preview.replaceChildren(...(cur?[
    h('img',{src:cur,onclick:()=>zoom(cur)}),
    h('button',{class:'danger',onclick:()=>{cur=null;changed=true;draw();}},'画像を外す')]:[]));
  const setFile=async f=>{
    try{cur=await resizeImage(f);changed=true;draw();}
    catch{toast('画像を読み込めませんでした');}
  };
  file.addEventListener('change',()=>{if(file.files[0])setFile(file.files[0]);file.value='';});
  // PCではスクショをテキスト欄に貼り付けても画像として入る
  ta.addEventListener('paste',e=>{
    const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));
    if(it){e.preventDefault();setFile(it.getAsFile());}
  });
  draw();
  return {
    el:h('div',{class:'field'},h('label',{},label),ta,
      h('div',{class:'row',style:'margin-top:8px'},h('button',{onclick:()=>file.click()},'画像を選ぶ')),
      file,preview),
    ta,
    value:()=>({text:ta.value,img:cur,changed}),
    reset(){ta.value='';cur=null;changed=false;draw();}
  };
}
async function renderEditor(deckId,cardId){
  const deck=await get('decks',deckId);
  const card=cardId?await get('cards',cardId):null;
  setHeader(card?'カードを編集':`${deck.name} に追加`,()=>renderDeck(deckId));
  const [fi,bi]=await Promise.all([getImg(card?.frontImg),getImg(card?.backImg)]);
  const front=makeSide('表（問題）',card?.front||'',fi);
  const back=makeSide('裏（答え）',card?.back||'',bi);

  async function save(){
    const f=front.value(),b=back.value();
    if(!f.text.trim()&&!f.img){toast('表が空です');return false;}
    const now=Date.now();
    const c=card?{...card}:{id:uid(),deckId,created:now,due:now,interval:0,ease:2.5,reps:0,lapses:0,lastReview:null,frontImg:null,backImg:null};
    c.front=f.text;c.back=b.text;
    await txMulti(['cards','images'],s=>{
      for(const [side,key] of [[f,'frontImg'],[b,'backImg']]){
        if(!side.changed)continue;
        if(c[key]){s.images.delete(c[key]);c[key]=null;}
        if(side.img){const id=uid();s.images.put({id,data:side.img});c[key]=id;}
      }
      s.cards.put(c);
    });
    return true;
  }

  const buttons=card
    ?h('div',{class:'row',style:'margin-top:20px'},
      h('button',{class:'primary',onclick:async()=>{if(await save()){toast('保存しました');renderDeck(deckId);}}},'保存'),
      h('button',{class:'danger',onclick:async()=>{
        if(!confirm('このカードを削除しますか？'))return;
        await txMulti(['cards','images'],s=>{
          if(card.frontImg)s.images.delete(card.frontImg);
          if(card.backImg)s.images.delete(card.backImg);
          s.cards.delete(card.id);
        });
        toast('削除しました');renderDeck(deckId);
      }},'削除'))
    :h('div',{class:'row',style:'margin-top:20px'},
      h('button',{class:'primary',onclick:async()=>{
        if(await save()){front.reset();back.reset();toast('保存しました');window.scrollTo(0,0);}
      }},'保存して次へ'),
      h('button',{onclick:async()=>{if(await save()){toast('保存しました');renderDeck(deckId);}}},'保存して終了'));
  show(front.el,back.el,buttons);
}

// ===== 学習 =====
async function renderStudy(deckId){
  const deck=await get('decks',deckId);
  const now=Date.now();
  const queue=(await cardsOf(deckId)).filter(c=>c.due<=now).sort((a,b)=>a.due-b.due);
  let done=0;
  const exit=()=>renderDeck(deckId);

  async function next(){
    setHeader(deck.name,exit,[h('span',{class:'meta'},`残り ${queue.length}`)]);
    if(!queue.length){
      show(h('div',{class:'empty'},
        h('div',{style:'font-size:40px'},'🎉'),
        h('p',{},`今日の分は終わりです（${done}回）`),
        h('button',{class:'primary',onclick:exit},'戻る')));
      return;
    }
    const c=queue.shift();
    const [fi,bi]=await Promise.all([getImg(c.frontImg),getImg(c.backImg)]);
    const sideEl=(t,img)=>h('div',{},
      t?h('div',{class:'side-text'},t):null,
      img?h('img',{class:'side-img',src:img,onclick:()=>zoom(img)}):null);
    const cardEl=h('div',{class:'study-card'},sideEl(c.front,fi));
    const bar=h('div',{class:'bottombar'});
    let busy=false;

    const answer=async g=>{
      if(busy)return;busy=true;
      Object.assign(c,schedule(c,g),{lastReview:Date.now()});
      await put('cards',c);
      if(g===0)queue.push(c); // 忘れたカードはこのセッションの最後にもう一度
      done++;
      next();
    };
    const reveal=()=>{
      cardEl.append(h('hr',{class:'divider'}),sideEl(c.back,bi));
      bar.replaceChildren(h('div',{class:'grades'},GRADES.map((g,i)=>
        h('button',{class:'grade',style:`background:var(--${g.key})`,onclick:()=>answer(i)},
          h('span',{},g.label),h('small',{},fmtIv(schedule(c,i).interval))))));
      keyHandler=e=>{const n='1234'.indexOf(e.key);if(e.key.length===1&&n>=0)answer(n);};
    };
    bar.append(h('button',{class:'primary',style:'width:100%;padding:14px',onclick:reveal},'答えを見る'));
    keyHandler=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();reveal();}};
    show(cardEl,h('div',{style:'height:110px'}),bar);
  }
  next();
}

// ===== 設定（バックアップ） =====
async function exportData(){
  const data={app:'anki-cards',version:1,exportedAt:new Date().toISOString(),
    decks:await getAll('decks'),cards:await getAll('cards'),images:await getAll('images')};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const d=new Date();
  const name=`anki-cards-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  const a=h('a',{href:URL.createObjectURL(blob),download:name});
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}
async function renderSettings(){
  setHeader('設定',renderHome);
  const imp=h('input',{type:'file',accept:'application/json,.json',style:'display:none'});
  imp.addEventListener('change',async()=>{
    const f=imp.files[0];imp.value='';
    if(!f)return;
    try{
      const d=JSON.parse(await f.text());
      if(!Array.isArray(d.decks)||!Array.isArray(d.cards))throw new Error('format');
      if(!confirm(`デッキ${d.decks.length}個・カード${d.cards.length}枚を読み込みます。同じデータは上書きされます。`))return;
      await txMulti(['decks','cards','images'],s=>{
        d.decks.forEach(x=>s.decks.put(x));
        d.cards.forEach(x=>s.cards.put(x));
        (d.images||[]).forEach(x=>s.images.put(x));
      });
      toast('読み込みました');
    }catch{toast('読み込みに失敗しました');}
  });
  let usage='';
  try{const e=await navigator.storage?.estimate?.();if(e)usage=`使用量: 約 ${(e.usage/1048576).toFixed(1)} MB`;}catch{}
  show(
    h('div',{class:'item'},
      h('div',{class:'deck-name'},'バックアップ'),
      h('p',{class:'meta'},'データはこの端末のブラウザ内だけに保存されています。ときどき書き出しておくと安心です。'),
      h('div',{class:'row'},
        h('button',{class:'primary',onclick:exportData},'書き出し'),
        h('button',{onclick:()=>imp.click()},'読み込み')),
      imp),
    usage?h('p',{class:'meta',style:'margin-top:16px'},usage):null);
}

// ===== 起動 =====
(async()=>{
  try{db=await openDB();}
  catch(e){$main.textContent='データベースを開けませんでした: '+e;return;}
  navigator.storage?.persist?.().catch(()=>{});
  renderHome();
})();
</script>
</body>
</html>
